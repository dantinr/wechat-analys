name: 问题反馈
description: 报告连接、采集、导出或界面问题
body:
  - type: markdown
    attributes:
      value: 请使用合成消息描述问题，不要上传聊天库、密钥、内存转储或含个人信息的截图。
  - type: input
    id: versions
    attributes:
      label: 版本信息
      description: 程序版本、微信完整版本号、Windows 版本及系统架构。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果或脱敏后的错误提示
    validations:
      required: true
