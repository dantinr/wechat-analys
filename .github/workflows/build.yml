name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Build, test and package synthetic fixtures
        run: |
          ./package.ps1
          ./package.ps1 -Standalone
      - name: Upload packages and synthetic test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Ripper-windows
          path: |
            artifacts/packages/*.zip
            artifacts/packages/SHA256SUMS.txt
            artifacts/packages/raw-tests*.json
          if-no-files-found: error
          retention-days: 14
